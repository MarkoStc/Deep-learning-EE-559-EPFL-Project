# ============================================================
# Red Queen Moderation — Default Configuration
# ============================================================

seed: 42

# --- Paths ---
data_dir: "data"
output_dir: "outputs"
checkpoint_dir: "outputs/checkpoints"

# --- Dataset ---
dataset:
  name: "civil_comments"            # "civil_comments" | "hatexplain"
  max_samples: 50000                 # subsample for speed; null = use all
  test_size: 0.15
  val_size: 0.15
  toxicity_threshold: 0.5           # for civil_comments binarization

# --- Guardian (classifier) ---
guardian:
  model_name: "distilbert-base-uncased"
  max_length: 128
  batch_size: 32
  learning_rate: 2.0e-5
  weight_decay: 0.01
  epochs: 3
  warmup_ratio: 0.1
  num_labels: 2

# --- Evader (RL agent) ---
evader:
  state_dim: 8                       # text feature vector dimension
  num_actions: 7                     # noop + 6 perturbation types
  hidden_dim: 64
  learning_rate: 1.0e-3
  episodes: 2000                     # number of bandit episodes
  batch_size: 64                     # texts per episode
  gamma: 1.0                         # bandit = no discounting
  entropy_coeff: 0.3     #0.01           # exploration bonus
  baseline_decay: 0.99               # running mean baseline

# --- Perturbation ---
perturbation:
  typo_prob: 0.3                     # per-word probability of typo
  leet_prob: 0.4
  homoglyph_prob: 0.3
  synonym_max_replacements: 2
  emoji_insert_count: 1

# --- Robust Training ---
robust:
  augmentation_ratio: 0.5            # fraction of stress cases to mix in
  epochs: 2
  learning_rate: 1.0e-5              # lower LR for fine-tuning

# --- Evaluation ---
eval:
  sanitize_logs: true                # mask hateful words in printed examples
  max_display_examples: 10
  mask_char: "█"

# --- Cluster (EPFL RCP) ---
cluster:
  uid: 309057
  image: "registry.rcp.epfl.ch/ee559/environment-with-packages:latest"
  gpu: 1
  pvc_claim: "home"
  pvc_path: "/home/mstojano"
  project_path: "/home/mstojano/red_queen"
