name: Feature request
description: Propose a change or a new experiment
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, or what result is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: evaluation
    attributes:
      label: How will we know it works?
      description: Tests, metrics or plots that would show the change is correct.
