[project]
name = "red-queen"
version = "0.1.0"
description = "Adversarial stress-testing of a hate-speech classifier with a reinforcement-learning attacker."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Marko Stojanovic" }]
dependencies = [
    "transformers>=5.0",
    "datasets>=3.0",
    "tokenizers>=0.21",
    "safetensors>=0.4",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "nltk>=3.9",
    "emoji>=2.12",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Pick exactly one torch build: `uv sync --extra cpu` or `uv sync --extra cu126`.
cpu = ["torch>=2.6"]
cu126 = ["torch>=2.6"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/red_queen"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
