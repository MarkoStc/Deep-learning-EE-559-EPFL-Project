[project]
name = "red-queen"
version = "0.1.0"
description = "Adversarial stress-testing of a hate-speech classifier with a reinforcement-learning attacker."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Marko Stojanovic" }]
dependencies = [
    "transformers>=5.0",
    "datasets>=3.0",
    "tokenizers>=0.21",
    "safetensors>=0.4",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "nltk>=3.9",
    "emoji>=2.12",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Pick exactly one torch build: `uv sync --extra cpu` or `uv sync --extra cu126`.
cpu = ["torch>=2.6"]
cu126 = ["torch>=2.6"]
tensorboard = ["tensorboard>=2.17"]
wandb = ["wandb>=0.18"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
    "types-tqdm>=4.66",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/red_queen"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Legacy modules from the course project. Each refactor branch removes its
# module from this list when it replaces it; the list must end up empty.
exclude = [
    "src/red_queen/data_loading.py",
    "src/red_queen/evader_env.py",
    "src/red_queen/evader_policy.py",
    "src/red_queen/evaluate.py",
    "src/red_queen/generate_stress_cases.py",
    "src/red_queen/models.py",
    "src/red_queen/outer_loop.py",
    "src/red_queen/preprocess.py",
    "src/red_queen/robust_train.py",
    "src/red_queen/train_guardian.py",
    "src/red_queen/utils.py",
]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "PL", "NPY"]
ignore = [
    "PLR0913",  # ML entry points take many hyperparameters
    "PLR2004",  # comparisons with small literals in metrics code are clear
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLC0415"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]
# transformers and torch.Tensor.backward ship without full annotations.
untyped_calls_exclude = ["transformers", "torch._tensor"]
warn_unreachable = true
# Same legacy list as ruff; shrinks to nothing during the refactor.
exclude = [
    'src/red_queen/data_loading.py$',
    'src/red_queen/evader_env.py$',
    'src/red_queen/evader_policy.py$',
    'src/red_queen/evaluate.py$',
    'src/red_queen/generate_stress_cases.py$',
    'src/red_queen/models.py$',
    'src/red_queen/outer_loop.py$',
    'src/red_queen/preprocess.py$',
    'src/red_queen/robust_train.py$',
    'src/red_queen/train_guardian.py$',
    'src/red_queen/utils.py$',
]

[[tool.mypy.overrides]]
module = ["datasets.*", "sklearn.*", "seaborn.*", "nltk.*", "emoji.*", "transformers.*", "tokenizers.*", "pyarrow.*", "tensorboard.*", "torch.utils.tensorboard.*", "wandb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: end-to-end tests that build a tiny model (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["red_queen"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
